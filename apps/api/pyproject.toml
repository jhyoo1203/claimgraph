[project]
name = "claimgraph-api"
version = "0.1.0"
description = "ClaimGraph FastAPI service"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "jsonschema>=4.23",
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
